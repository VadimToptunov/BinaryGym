[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binarygym"
version = "0.2.0"
description = "Procedural, reproducible, automatically verified reverse-engineering practice challenges."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
binarygym = "binarygym.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/binarygym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
